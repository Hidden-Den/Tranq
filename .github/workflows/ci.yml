name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Сборка и unit-тесты
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Проверка имени
        run: bash scripts/check-brand.sh

      # Go нужен и тестам MCP-сервера, и сборке Xcode: фаза приложения
      # собирает tranq-mcp и без Go падает.
      - name: Установка Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go.mod
          cache: false

      - name: Форматирование Go
        working-directory: mcp
        run: |
          # Все отслеживаемые файлы Go, кроме vendor
          files=$(git ls-files '*.go' | grep -v '^vendor/')
          unformatted=$(gofmt -l $files)
          if [ -n "$unformatted" ]; then
            echo "Не отформатировано gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Проверка Go
        working-directory: mcp
        run: go vet ./...

      - name: Тесты Go
        working-directory: mcp
        run: go test -mod=vendor -race ./...

      - name: Версия Xcode
        run: xcodebuild -version

      # Модели и CLI-бинарники не нужны: без них проект собирается,
      # а тесты, которым нужна модель GigaAM, пропускаются.
      - name: Сборка и тесты
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Tranq.xcodeproj \
            -scheme Tranq \
            -destination 'platform=macOS' \
            -only-testing:TranqTests \
            -derivedDataPath build/DerivedData-ci \
            CODE_SIGN_IDENTITY=- \
            | tee build/xcodebuild.log | grep -E "error:|Test run with|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/xcodebuild.log

      - name: Отчёт о тестах
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/DerivedData-ci/Logs/Test/*.xcresult
            build/xcodebuild.log
          retention-days: 7
